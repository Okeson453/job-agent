description: >
  A two-engine MetaTrader 5 system: OrionSentinel v1 "The Fortress" is a
  deterministic, fixed-rule capital-management and execution engine; V2
  "Signal Generation & Transport" is the companion signal side, producing
  a Composite Conviction Score (CCS) that v1 consumes via a Global
  Variable interface.
problem: >
  Separate signal generation from capital/execution risk so that no
  upstream signal source can ever directly control money — and make the
  execution engine's risk rules structurally impossible to bypass rather
  than merely policy.
solution: >
  v1 is the sole capital authority: every proposed trade passes an 8-layer
  guard stack and is opened as a basket of 2-5 identically-parameterized
  positions (basket, not position, is the unit of risk). V2 has no
  execution authority at all — it only ever proposes, via pillar-fusion
  scoring (Structure/Momentum/Liquidity/RegimeSession + DXY alignment)
  feeding a graduated confluence score.
responsibilities:
  - "Designed and implemented both engines end-to-end: v1's 8-layer guard stack, Constellation basket state machine, and Nexus Ledger persistence; V2's pillar-fusion scoring and Global Variable signal-commit protocol."
  - "Wrote the 14 non-negotiable design constraints (sole capital authority, Anchor Float never decreases, fixed SL/TP, no recovery/hedging/scale-in, etc.) and enforced them structurally in code, not just as policy."
  - "Debugged Exness broker symbol-suffix conventions, MQL5 indicator API incompatibilities, CSV config-loading bugs, and Global Variable protocol checksum mismatches across multiple diagnostic cycles."
  - "Diagnosed a zero-trade-emission issue in backtesting and staged an architectural revision (lowered emission floors, loosened TOD threshold, softened chop compression, widened confirmation-gate tolerance)."
  - "Built the operational tooling suite (TODMatrixBuilder, AttributionReview, OutcomeTagger, SupplyCapReport) and 5 dedicated validation-protocol test scripts."
architecture: "See OrionSentinel/architecture.md for the full v1/V2 pipeline diagrams — kept as a linked evidence file rather than duplicated here."
technologies: "Native MQL5 only, zero DLLs/external libraries/raw sockets — see OrionSentinel/technologies.yaml."
key_features:
