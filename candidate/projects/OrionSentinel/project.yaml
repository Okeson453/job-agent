  - "Conviction-proportional exposure via lookup table, not formula"
  - "Zero external dependency, structurally enforced (verified by code review)"
  - "Two-terminal-folder deployment model for multi-instance config sharing"
  - "Composite Conviction Score (CCS) fusion engine with Schmitt-hysteresis confirmation gating"
security: "No dedicated security audit — risk containment is the core design goal, not application security in the conventional sense (see the 14 non-negotiables in challenges.md)."
