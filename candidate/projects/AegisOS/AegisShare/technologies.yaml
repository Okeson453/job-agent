frontend:
  framework: "React 18 + TypeScript 5.4"
  build: "Vite 5"
  routing: "React Router v6"
  state: "Zustand 4.5"
  styling: "Tailwind CSS 3.4 + CSS variables"
  animation: "Framer Motion 11"
  crypto: "WebCrypto API + argon2-browser (AES-GCM, ECIES, Argon2id — all client-side)"
  testing: ["Vitest", "Playwright", "axe-core"]
  fonts: "Playfair Display (headings) + JetBrains Mono (data) + Plus Jakarta Sans (body); admin console: Cinzel + gold accent"
backend:
  gateway: "TypeScript + Express 5 (sole public HTTP/WSS entry point)"
  microservices: "Rust (Axum + Tokio + Tonic) — 9 services"
  policy_engine: "OPA (Rego 0.62), PDP p99 < 15ms"
  audit_db: "ClickHouse (append-only, Merkle-chained, WORM)"
  relational_db: "PostgreSQL 16"
  key_material: "AWS CloudHSM (FIPS 140-3 L3)"
  object_storage: "AWS S3 (Object Lock Compliance, 7-year WORM)"
  event_streaming: "Apache Kafka"
  cache: "Redis 7 (L2; moka in-process L1)"
  observability: "Prometheus + OpenTelemetry"
key_rust_deps: "tokio 1.36, axum 0.7, tonic 0.11, sqlx 0.7, rdkafka 0.36, aes-gcm 0.10, argon2 0.5, k256 0.13 (secp256k1 ECIES), jsonwebtoken 9, tracing 0.1, opentelemetry 0.22, prometheus 0.13"
services_and_ports:
  api-gateway: "8080 HTTP/WSS"
  auth-service: "8081"
  user-service: "50055 gRPC"
  file-metadata-service: "50051 gRPC"
  policy-service: "50052 gRPC + 8181 OPA sidecar"
  key-management-service: "50054 gRPC"
  sharing-service: "50056 gRPC"
  audit-service: "50053 gRPC"
  threat-intel-service: "8087 HTTP + 50059 gRPC"
