description: >
  A full-stack, real-time crash gaming and platform-operations system —
  not a player-side betting bot, but a platform you'd run as the house.
  A backend Control Plane (Fastify) owns identity, authorization, game
  state, betting, and balances; a React/Telegram Mini App and a
  standalone Next.js admin dashboard both consume that same Control
  Plane rather than duplicating business logic.
problem: >
  Build a crash-game platform where the frontend (including the Telegram
  Mini App) is never trusted as a security boundary — identity,
  authorization, game state, betting, and balances must all be resolved
  server-side, on every request, with deterministic, auditable state.
solution: >
  A single Control Plane is the sole authority for everything sensitive.
  Every admin/security-relevant action flows through one explicit chain:
  Telegram initData -> signature verification -> identity resolution ->
  tenant resolution -> RBAC -> admin API authorization -> operation ->
  audit event. Operational safety is governed by named principles: Safety
  Over Continuity, Deterministic State, Idempotency, Reconciliation,
  Auditability, Fail-Safe Recovery.
responsibilities:
  - "Designed and built the Fastify Control Plane: authentication, RBAC, game services, betting, wallet, admin, and audit subsystems."
  - "Built the React/Vite Telegram Mini App (Home/Play/Wallet/History/Profile) and a standalone Next.js admin dashboard against the same Control Plane APIs."
  - "Implemented the betting/wallet safeguard chain: idempotency, risk evaluation, confirmation flow, cash-out, execution-mode gating, balance reconciliation."
  - "Wrote and ran 19 database migrations tracking the platform's evolution, including production-hardening changes."
  - "Set up deployment infrastructure: Docker/docker-compose (base/prod/tenant variants), Railway, and GitHub Actions CI/CD (ci.yml, deploy.yml, docker-build.yml)."
architecture: "See Crash/architecture.md for the full Control Plane diagram and repository structure — kept as a linked evidence file rather than duplicated here."
technologies: "See Crash/technologies.yaml (Node.js 20+/TypeScript/Fastify, PostgreSQL+TimescaleDB-compatible schema, Redis, Socket.IO, Telegraf, Zod, Pino, Prometheus client, React/Vite/Zustand/TanStack Query on the Mini App, Next.js admin dashboard)."
key_features:
  - "Full crash game player interface with real-time multiplier updates, bet placement, cash-out, reconnection/offline-recovery handling"
  - "Full Telegram Mini App integration (MainButton, reactive theme)"
  - "Admin available from both a standalone dashboard and the Mini App via the same Control Plane APIs — no duplicated backend"
  - "Betting/wallet safeguards: idempotency, risk evaluation, balance reconciliation"
  - "JWT access/refresh auth with revocation, tenant-aware RBAC, audit logging, rate limiting"
security: "RBAC resolved server-side on every request; client-provided role info is never treated as authoritative. No independent third-party security audit yet — see engineering_challenges."
performance: "No live/production performance numbers stated in the repo's own docs — 'production acceptance criteria' (zero TS/ESLint errors, no uncontrolled any, no unsanitized HTML injection, no secrets in source, accessibility + security rules passing) is a stated bar, not a confirmed result; final sign-off is explicitly still pending."
