services: {python: 18, go: 2}
style: "monorepo"
shared_packages: 12
frontend: "React + TypeScript (Next.js) — server components for the data-heavy control plane"
backend: "FastAPI (Python) — native async, Pydantic schema validation shared with agent I/O contracts"
api_gateway: "Kong"
workflow_engine: "Temporal — durable execution, replay-from-checkpoint, saga/compensation semantics"
event_bus: "NATS JetStream (migrate to Kafka only if sustained throughput or exactly-once/long-retention needs exceed it)"
primary_db: "PostgreSQL 15+ (row-level security for tenant isolation)"
timeseries_db: "TimescaleDB (Postgres extension)"
vector_db: "pgvector on primary Postgres initially (migrate to Qdrant if ANN latency/volume demands it)"
graph: "Content Asset Graph implemented as Postgres foreign-key relations + recursive CTEs by default (Neo4j only if multi-hop lineage queries become a measured bottleneck)"
object_storage: "S3-compatible (AWS S3 or Cloudflare R2)"
cache: "Redis (also backs short-term/working agent memory)"
ai_provider_gateway: "LiteLLM"
llm_observability: "Dedicated LLM tracing layer (Helicone/LangSmith-class or custom OTel LLM exporter)"
monitoring: "Prometheus + Grafana"
logging: "Loki"
tracing: "Jaeger (OpenTelemetry-instrumented)"
containers: "Docker + Kubernetes"
cicd: "GitHub Actions + ArgoCD (GitOps)"
secrets: "HashiCorp Vault"
auth: "Auth0 (human users) + service-account JWTs (agents)"
analytics_warehouse: "ClickHouse"
