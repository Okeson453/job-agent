description: >
  An end-to-end, zero-touch AI media production and growth platform that
  autonomously operates faceless YouTube channels: market intelligence,
  content strategy, ideation, research, scripting, video generation,
  clipping, editing, thumbnails, SEO, publishing, scheduling, analytics,
  and continuous optimization — 30 AI agents across six domains
  (intelligence, creative, production, clipping, distribution, operations).
problem: >
  Turn one research input into one long-form asset, then into many
  context-complete derivative assets, with measurable performance feeding
  back into a learned production/distribution policy — autonomously, but
  human-overridable at every stage.
solution: >
  A provider-agnostic, multi-agent architecture (capability interfaces +
  a LiteLLM provider gateway) orchestrated by Temporal for durable,
  replayable multi-stage workflows, with a Content Asset Graph providing
  full lineage from research input to every derivative clip/thumbnail/
  title. An 8-factor AI Clipping Engine scores candidate clips; Quality &
  Safety Gates run before anything auto-publishes.
responsibilities:
  - "Authored the system architecture (14-layer decomposition, 6-batch dependency-ordered build plan) and the Content Asset Graph lineage model."
  - "Established the project's core governing principle after a platform migration: all prior 'complete'/'verified' status claims are treated as unconfirmed until re-derived from actual files on disk."
  - "Ran a systematic honest-baseline audit distinguishing genuinely implemented code from stubs."
  - "Fixed structural issues: removed 18 duplicate re-export test files, flattened 18 Group B agents to the canonical flat structure, resolved 41 pytest collection errors, rewrote pyproject.toml from scratch with poetry.lock regeneration."
  - "Implemented real (non-stub) logic for scripting_agent, executive_orchestrator_agent, and market_audience_intelligence_agent, each with tests exercising the real mock-provider-gateway via httpx.ASGITransport."
  - "Found and fixed two pre-existing bugs in data-ingestion-pipeline surfaced only once real code paths were exercised for the first time."
