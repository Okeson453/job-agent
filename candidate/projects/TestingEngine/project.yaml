description: >
  BcTracker — an autonomous live prediction engine for BC.Game Crash rounds,
  targeting a 1.30x cash-out threshold. A long-lived Railway worker ingests
  live crash events, generates round-ahead (N+1) predictions, validates
  outcomes after the fact, and delivers signals via Telegram. A separate
  Vercel dashboard is strictly read-only against the same PostgreSQL
  database — it never polls or predicts itself.
problem: >
  Generate a statistically defensible ENTRY signal for the next crash round
  before it starts, with zero outcome leakage, exactly-once prediction
  ownership per round, and delivery that beats the round's own start time.
solution: >
  ACIE (Adaptive Crash Intelligence Engine) — a multi-model PSI ensemble
  with online weight updates and optional Platt calibration — is the
  authoritative live scorer once history is warm (5+ observed rounds), with
  a strategy layer (ENTRY / REDUCED_ENTRY / SKIP) gated by an adaptive edge
  threshold and an ensemble-disagreement skip. A separate PredictionEngine
  + feature-engine stack runs as an explicitly-tagged fallback when ACIE is
  unavailable.
responsibilities:
  - "Designed and implemented the ED(N)->predict N+1->outbox->Telegram production prediction pipeline."
  - "Built the ACIE multi-model PSI ensemble with online weight updates and Platt calibration."
  - "Implemented the correctness contracts: single prediction owner per round, temporal delivery guarantees, no outcome leakage, idempotent dedup, and worker authority fencing."
  - "Diagnosed and fixed multiple production incidents (documented in FORENSIC_PREDICTION_ENGINE_REPORT.md, LATENCY_* series, DISCONNECTION_DIAGNOSIS.md, DATABASE_AUDIT_REPORT.md)."
  - "Evaluated and declined a C++23 rewrite of the engine after determining the system is I/O-bound (WebSocket/DB/Telegram), not compute-bound."
  - "Ran a strict sequential N+1 backtest (~33k rounds) at the 1.30x target and iterated on model quality without overfitting or selective reporting."
