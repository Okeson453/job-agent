# Standard answer text for the recurring "are you authorized to work in
# X / will you require sponsorship" form questions — write it once,
# verbatim, so every application answers identically.
standard_answer: "I confirm that the information provided regarding my citizenship, residence, work authorization, and availability is accurate to the best of my knowledge. I am willing to provide appropriate documentation and complete required employment, identity, background-check, and work-authorization procedures. Any international employment or relocation arrangement will be subject to applicable immigration, employment, tax, and legal requirements."
